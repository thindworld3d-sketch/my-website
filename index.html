<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Pick Hub</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f2f2f2;
}

header {
  background: #131921;
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 22px;
}

.search-box {
  text-align: center;
  margin: 20px;
}

.search-box input {
  padding: 10px;
  width: 200px;
}

.search-box button {
  padding: 10px;
  background: orange;
  border: none;
  cursor: pointer;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 10px;
}

.price {
  color: green;
  font-weight: bold;
}

.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 12px;
  background: orange;
  color: black;
  text-decoration: none;
  border-radius: 5px;
}

footer {
  text-align: center;
  padding: 15px;
  font-size: 12px;
  background: #ddd;
}
</style>
</head>

<body>

<header>Top Pick Hub</header>

<div class="search-box">
  <input type="number" id="searchInput" placeholder="Enter Product ID">
  <button onclick="searchProduct()">Search</button>
</div>

<div class="container" id="productContainer"></div>

<footer>
We earn commission from affiliate links
</footer>

<script>

// 🔥 PRODUCTS DATA (yahin add kare)
let products = [
  {
    id: 1,
    name: "Manual Pull-Cord Food Chopper",
    price: "₹159",
    link: "https://amzn.to/41zJOL2",
    image: "product_image_01.jpg"
  },
  {
    id: 2,
    name: "Smart Multipurpose Foldable Laptop Table with Cup Holder, Study Table, Bed Table, Breakfast Table, Foldable and Portable/Ergonomic & Rounded Edges/Non-Slip Legs (Black New)",
    price: "₹300",
    link: "https://amzn.to/4t7Lo2C",
    image: "product_image_31.jpg"
  },
  
  {
    id: 3,
    name: "Raxon Innovation (39 Inches, Pack of 5) PVC Door Guard Gap Filler for Door Bottom Seal Strip - Sound-Proof, Reduce Noise, Energy Saving Door Stopper for Reduce Door Dust, Door Guard for Home",
    price: "₹188",
    link: "https://amzn.to/4uZSIyT",
    image: "product_image_11.jpg"
  },
  
  {
    id: 4,
    name: "Scotch-Brite Small wiper for Kitchen, Bathroom, Dinning tables, car windows wiping, instant dry surface, Superior TPE Blade, moulded handle",
    price: "₹170",
    link: "https://amzn.to/4tebe4W",
    image: "product_image_41.jpg"
  }
];

// 🔥 DISPLAY PRODUCTS
function displayProducts(list) {
  let container = document.getElementById("productContainer");
  container.innerHTML = "";

  list.slice().reverse().forEach(p => {
    container.innerHTML += `
      <div class="card">
        <img src="${p.image}">
        <h3>${p.name}</h3>
        <p>ID: ${p.id}</p>
        <p class="price">${p.price}</p>
        <a href="${p.link}" target="_blank" class="btn">Buy Now</a>
      </div>
    `;
  });
}

// 🔥 SEARCH SYSTEM
function searchProduct() {
  let value = document.getElementById("searchInput").value;
  let result = products.filter(p => p.id == value);

  if(result.length > 0){
    displayProducts(result);
  } else {
    alert("Product not found");
  }
}

// 🔥 LOAD PRODUCTS
displayProducts(products);

</script>

</body>
</html>
